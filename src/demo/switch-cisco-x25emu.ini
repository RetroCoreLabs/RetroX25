# Demo switch that joins THREE worlds: our callers, the Cisco router R1 (GNS3) and x25emu (the C emulator in WSL).
# It is demo/switch-cisco.ini plus two ports for x25emu. Start x25emu's test network first
# (demo/crossenv-test.ps1 starts it for the tests; see docs/crossenv-testing.md).
#
# Our side:   DNIC 2350, this switch runs on the Windows PC (192.168.1.180 in the bench).
# Cisco side: DNIC 2360, router R1 at 192.168.1.155. Cisco XOT always uses TCP port 1998.
# x25emu:     DNIC 2340 (Switch A) and behind it 2341 and 2342. It runs in WSL; "host" in port.5 is the WSL address,
#             which changes after a reboot (wsl hostname -I).
#
# What can call what:
#   x25emu PAD  -> 2360...  Switch A sends it out of its XOT trunk to port.4 here, route.1 hands it to R1 (port.2).
#   R1 PAD      -> 2343...  R1's route "^2343 xot <this PC>" lands on port.1, route.3 sends it to Switch A (port.5).
#   our callers -> 2360... (R1) or 2340.../2343... (x25emu) or 23500001 (our echo).

[switch]
name = Switch-Cisco-X25emu
dnic = 2350
mgmt_port = 9104
monitor_port = 4004
mgmt_addr = 23500000

# Callers: x25pad and x25traffic connect here.
[port.0]
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 2200
lci_count = 64

# The Cisco router dials IN to us here.
[port.1]
type = trunk
transport = xot
mode = dce
host = 0.0.0.0
port = 1998
peer_name = Cisco-R1

# We dial OUT to the Cisco router here.
[port.2]
type = trunk
transport = xot
mode = dte
host = 192.168.1.155
port = 1998
peer_name = Cisco-R1

# The echo service attaches here.
[port.3]
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 2203
lci_count = 64

# x25emu Switch A dials IN to us here (its port 4, for calls to 2351 and, with the extra route in
# demo/crossenv-wsl.sh, for calls to 2360).
[port.4]
type = trunk
transport = xot
mode = dce
host = 0.0.0.0
port = 2210
peer_name = x25emu-A

# We dial OUT to x25emu Switch A's access port 2001 here, for calls to 2343 (its endpoint port).
[port.5]
type = trunk
transport = xot
mode = dte
host = 172.24.50.23
port = 2001
peer_name = x25emu-A

[route.2]
type = exact
address = 23500001
port = 3

[route.0]
type = dnic
dnic = 2350
port = 0

[route.1]
type = prefix
address = 2360
prefix_len = 4
port = 2

# Calls for x25emu's endpoint port (2343...) go out to Switch A.
[route.3]
type = prefix
address = 2343
prefix_len = 4
port = 5

[route.4]
type = prefix
address = 2340
prefix_len = 4
port = 5

[user.0]
name = admin
password = admin
level = 1
