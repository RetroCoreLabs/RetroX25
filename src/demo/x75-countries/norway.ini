# Norway - DNIC 2422. The calling side: PAD users at the University of Tromsø.
#
#   port 0  PAD users (x25pad -x 127.0.0.1:25001)   NUI required
#   port 1  echo service 24229001 (x25echo connects here, 25002)
#   port 2  X.75 link to England (we dial England's port 0 on 25011)
#
# Users dial other countries with the international prefix 0 (X.121 7.8.1): CALL 026245890040004.
# The 0 is taken off before the call leaves Norway (port 2 sends the full international number).

[switch]
name = Norway
dnic = 2422
mgmt_port = 9201
monitor_port = 4201
mgmt_addr = 24220000
# One line per finished call, with the paying NUI (relative to the folder the script runs in).
cdr_file = logs/norway-calls.txt

[network]
own_dnic = 2422
international_prefix = 0

# The PAD users' line. Every call must name a NUI (X.25 6.21.3); a call without one, or with an unknown one,
# is cleared with Local procedure error, diagnostic 84.
# The network, not the PAD, says where a call comes from: 24227000 + the call's channel, so callers are
# 24227001, 24227002, ... and the chat, the call records and the other countries can tell them apart.
# The NUI only decides who pays; it never reaches the called machine (X.25 6.21).
[port.0]
name = PAD users
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25001
lci_count = 64
nui_required = yes
calling_address_base = 24227000

# The echo service's line.
[port.1]
name = Echo 24229001
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25002
lci_count = 64

# X.75 to England (PSS). We are the DTE end: we dial and search channels from the highest (X.75 3.1.4).
[port.2]
name = X.75 to England
type = trunk
trunk_kind = network
transport = hdlc-tcp
mode = dte
host = 127.0.0.1
port = 25011
lci_count = 64
peer_name = England
peer_monitor_port = 4202
peer_mgmt_addr = 23420000

[route.0]
name = Echo
number = 24229001
port = 1

[route.1]
name = England
dnic = 2342
port = 2

# Germany is reached through England (Norway has no direct link to Germany).
[route.2]
name = Germany via England
dnic = 2624
port = 2

# The test users' NUIs. Each one is its own account, so its calls and charges are counted apart
# (show x25 account / show x25 invoice <name> on the management console).
[account.0]
name = uit-1
nui = 242226500000101

[account.1]
name = uit-2
nui = 242226500000102

[account.2]
name = uit-3
nui = 242226500000103

[account.3]
name = uit-4
nui = 242226500000104

# Management console login (telnet localhost 9201).
[user.0]
name = admin
password = admin
level = 1
