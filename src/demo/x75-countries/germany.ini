# Germany - DNIC 2624. The called side: Altos in München.
#
#   port 0  X.75 from England (England dials in on 25021)
#   port 1  Altos host line: 2624589004xxxx (x25service with altos-chat.json connects here, 25022)
#   port 2  echo service 26249001 (x25echo connects here, 25023)
#   port 3  host line: 26241xxx (x25host connects here, 25024)

[switch]
name = Germany
dnic = 2624
mgmt_port = 9203
monitor_port = 4203
mgmt_addr = 26240000
cdr_file = logs/germany-calls.txt

[network]
own_dnic = 2624

[port.0]
name = X.75 from England
type = trunk
trunk_kind = network
transport = hdlc-tcp
mode = dce
host = 0.0.0.0
port = 25021
lci_count = 64
peer_name = England
peer_monitor_port = 4202
peer_mgmt_addr = 23420000

# The Altos host. The chat's runtime is the XOT client here: it keeps one idle connection open for each call
# to arrive on, and each call uses a connection of its own, so the port needs one channel more than the most
# chat users at once (30 in altos-chat.json).
[port.1]
name = Altos 2624589004
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25022
lci_count = 64

[port.2]
name = Echo 26249001
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25023
lci_count = 64

# Every address on the Altos host (2624589004 + 4 digits) goes to its line; the chat answers 26245890040004.
# The host line: the fake machines of this country (x25host, one program for all of them, connects here).
# Like the Altos line in Germany, the host program keeps spare connections open for calls to arrive on and
# answers each call by the number dialled, so one line carries every host in the block below.
[port.3]
name = Hosts 26241xxx
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25024
lci_count = 64

[route.0]
name = Altos
prefix = 2624589004
port = 1

[route.1]
name = Echo
number = 26249001
port = 2

[route.2]
name = Back to England
default = yes
port = 0

# Every number 26241xxx is a host on the host line.
[route.4]
# The scripted Altos chat (x25host, builtin:altos-chat) sits next to the C# one: its number is one more, and an
# exact number outranks the Altos prefix route above, so this one call goes to the host line instead.
name = Altos scripted
number = 26245890040005
port = 3

[route.3]
name = Hosts
prefix = 26241
port = 3

[user.0]
name = admin
password = admin
level = 1
