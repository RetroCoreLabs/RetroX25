# The test servers of the three-country network, all run by one x25host (./x75.ps1 start).
#
# Each [machine.N] is one service: a host folder (type = its name in the library) or a JavaScript file (type =
# script, the file in hosts/), the X.121 number it answers, and the switch line
# it hangs on. Every country has one host line, and all of that country's services share it: the switch routes
# each machine's number to the line, and x25host gives each call to the machine with that exact number.
#
#   Norway   host line TCP 25003
#   England  host line TCP 25013
#   Germany  host line TCP 25024
#
# The numbers are real host numbers of the time from the X.25 Network Atlas (docs/atlas), written without the
# leading 0 the Atlas shows (that is the prefix for dialling abroad). The host behind each is this library's.
#
# To add a server: write a script in hosts/, add a [machine.N] with a number in that country (its DNIC first), add
# an exact route for that number to the country's host line in <country>.ini, then ./x75.ps1 stop and start. The script API is the README of the RetroIO package
# RetroIO.Protocols.X25.Host; the format of this file is docs/x25host-format.md ("Many machines at once").
# setting.<name> = value gives the script machine.settings.<name>.

[defaults]
library = ../hosts           # the host folders (demo/hosts): type = vax is ../hosts/vax/host.ini

[machine.0]
type = script
script = hosts/clock.js
hostname = OSLOCLOCK
nua = 2422211000074
switch = 127.0.0.1:25003
group = norway

[machine.1]
type = script
script = hosts/guess.js
hostname = LONDONGAMES
nua = 234223519191
switch = 127.0.0.1:25013
group = england

[machine.2]
type = script
script = hosts/board.js
hostname = MUNICHBOARD
nua = 26244422190371
switch = 127.0.0.1:25024
group = germany

# The two host folders: a VAX with a DCL command line (log in GUEST / GUEST) and a menu bulletin board (GUEST, any
# password). The nua here wins over the address in their host.ini.

[machine.3]
type = vax
hostname = TOMVAX
nua = 234284400108
switch = 127.0.0.1:25013
group = england

[machine.4]
type = bbs
hostname = NORDBBS
nua = 24224501340
switch = 127.0.0.1:25003
group = norway

# More machines and boards of the time (texts from docs/research-os.md; each host.ini says which are verbatim).

[machine.5]
type = sintran                # Norsk Data ND-100, SINTRAN III: ENTER GUEST, PASSWORD: GUEST
hostname = NDOSLO
nua = 24222110000020
switch = 127.0.0.1:25003
group = norway

[machine.6]
type = primos                 # Prime, PRIMOS 19.4: GUEST / PRIME
hostname = PPOA1
nua = 234223440144
switch = 127.0.0.1:25013
group = england

[machine.7]
type = wwiv                   # WWIV bulletin board: GUEST, any password
hostname = THAMESWWIV
nua = 234219210050
switch = 127.0.0.1:25013
group = england

[machine.8]
type = bsd                    # VAX, 4.3BSD Unix: guest / guest
hostname = ucbvax
nua = 26245890040262
switch = 127.0.0.1:25024
group = germany

[machine.9]
type = maximus                # Maximus FidoNet board: GUEST, any password
hostname = ISARBOX
nua = 26245400091110
switch = 127.0.0.1:25024
group = germany

# The Altos chat as a script, beside the C# one (x25service, 26245890040004): one number higher. Germany routes this
# one number to its host line (germany.ini, route "Altos scripted").

[machine.10]
type = script
script = builtin:altos-chat
hostname = ALTOSJS
nua = 26245890040005
switch = 127.0.0.1:25024
group = germany
