# The test servers of the three-country network, all run by one x25host (./x75.ps1 start).
#
# Each [machine.N] is one service: a JavaScript file (in hosts/), the X.121 number it answers, and the switch line
# it hangs on. Every country has one host line, and all of that country's services can share it: the line takes
# every number that starts with its prefix, and x25host gives each call to the machine with that exact number.
#
#   Norway   host line TCP 25003, numbers 24221...
#   England  host line TCP 25013, numbers 23421...
#   Germany  host line TCP 25024, numbers 26241...
#
# To add a server: write a script in hosts/, add a [machine.N] with the next free number on that country's line,
# then ./x75.ps1 stop and ./x75.ps1 start. The script API is the README of the RetroIO package
# RetroIO.Protocols.X25.Host; the format of this file is docs/x25host-format.md ("Many machines at once").
# setting.<name> = value gives the script machine.settings.<name>.

[machine.0]
type = script
script = hosts/clock.js
hostname = OSLOCLOCK
nua = 24221001
switch = 127.0.0.1:25003
group = norway

[machine.1]
type = script
script = hosts/guess.js
hostname = LONDONGAMES
nua = 23421001
switch = 127.0.0.1:25013
group = england

[machine.2]
type = script
script = hosts/board.js
hostname = MUNICHBOARD
nua = 26241001
switch = 127.0.0.1:25024
group = germany
