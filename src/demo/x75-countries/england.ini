# England - DNIC 2342. A transit network between Norway and Germany.
#
#   port 0  X.75 from Norway (Norway dials in on 25011)
#   port 1  X.75 to Germany (we dial Germany's port 0 on 25021)
#   port 2  echo service 23429001 (x25echo connects here, 25012)
#   port 3  host line: LONDONGAMES, TOMVAX, PPOA1, THAMESWWIV (x25host connects here, 25013)
#
# A call from Norway to Germany crosses England, so England adds 2342 to the X.75 transit list (X.75 5.3.1).

[switch]
name = England
dnic = 2342
mgmt_port = 9202
monitor_port = 4202
mgmt_addr = 23420000
cdr_file = logs/england-calls.txt

[network]
own_dnic = 2342

# X.75 from Norway. We are the DCE end: we listen and search channels from the lowest.
[port.0]
name = X.75 from Norway
type = trunk
trunk_kind = network
transport = hdlc-tcp
mode = dce
host = 0.0.0.0
port = 25011
lci_count = 64
peer_name = Norway
peer_monitor_port = 4201
peer_mgmt_addr = 24220000

# X.75 to Germany. We are the DTE end: we dial.
[port.1]
name = X.75 to Germany
type = trunk
trunk_kind = network
transport = hdlc-tcp
mode = dte
host = 127.0.0.1
port = 25021
lci_count = 64
peer_name = Germany
peer_monitor_port = 4203
peer_mgmt_addr = 26240000

[port.2]
name = Echo 23429001
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25012
lci_count = 64

# The host line: the fake machines of this country (x25host, one program for all of them, connects here).
# Like the Altos line in Germany, the host program keeps spare connections open for calls to arrive on and
# answers each call by the number dialled, so one line carries every host routed to it below.
[port.3]
name = Hosts
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 25013
lci_count = 64

[route.0]
name = Echo
number = 23429001
port = 2

[route.1]
name = Norway
dnic = 2422
port = 0

[route.2]
name = Germany
dnic = 2624
port = 1

# The hosts on the host line, one exact route each: real numbers of the time from the X.25 Network Atlas
# (docs/atlas), which share no block. A new host in machines.ini needs its route here too.
[route.3]
name = LONDONGAMES
number = 234223519191
port = 3

[route.4]
name = TOMVAX
number = 234284400108
port = 3

[route.5]
name = PPOA1
number = 234223440144
port = 3

[route.6]
name = THAMESWWIV
number = 234219210050
port = 3

[user.0]
name = admin
password = admin
level = 1
