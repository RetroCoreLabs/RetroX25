# A WWIV 4.x bulletin board. Format: docs/x25host-format.md. Texts: docs/research-os.md 6.2.
# Verbatim (WWIV 4 user manual): the main-menu keys and their names, the [Sub 1] prompt line. Reconstructed: the
# login prompts (the manual describes them, it does not quote them), the banner, the news and the logoff text.

[host]
hostname = THAMESWWIV
address = 23421004
sessions = 4
banner = banner.txt

[login]
user_prompt = "Enter your name or number: "
password_prompt = "Password: "
case = upper
attempts = 3
fail_text = Wrong.
motd = motd.txt
then = menu.main

[user.0]
name = GUEST
password =

[user.1]
name = SYSOP
password = WWIV

[menu.main]
title = main-menu.txt
prompt = "[Sub 1] [Messages from The Management] : "
item.0 = I | System News and Info | file:news.txt
item.1 = U | View User List | text:#1 SYSOP  #2 {user} (on now, from {calling})
item.2 = C | Page Sysop for Chat | text:The sysop is not around.
item.3 = G | General Text Files | menu.gfiles
item.4 = O | Log Off the System | logout
unknown = Select I, U, C, G or O.

[menu.gfiles]
title = gfiles-menu.txt
prompt = "Select [1, Q to quit] : "
item.0 = 1 | About X.25 | file:x25.txt
item.1 = Q | Quit | menu.main
unknown = No such file.

[shell]
logout_text = Thanks for calling {hostname}.
