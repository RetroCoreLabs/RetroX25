# A Norsk Data ND-100 running SINTRAN III. Format: docs/x25host-format.md. Texts: docs/research-os.md 5.1.
# Verbatim from the ND manuals: the boot banner, ENTER, PASSWORD:, the @ prompt, -- EXIT --, the TERMINAL-STATUS
# columns. Reconstructed (not in the manuals found so far): the text for a wrong login and for an unknown command,
# the command DATCL and its output, the help text, and the file names (written the SINTRAN way, (USER)NAME:TYPE).
# A real SINTRAN line waits for ESC before it prints ENTER; this host prints ENTER at once.

[host]
hostname = NDOSLO
sessions = 8
banner = banner.txt

[login]
user_prompt = "ENTER "
password_prompt = "PASSWORD: "
case = upper
attempts = 3
fail_text = ILLEGAL USER NAME OR PASSWORD
then = shell

[user.0]
name = GUEST
password = GUEST

[user.1]
name = SYSTEM
password = ND

[shell]
prompt = "@"
case = upper
unknown = NO SUCH COMMAND
logout_text = -- EXIT --
who_format = "  {user}   {calling}   {since}"
time_format = vms

[command.0]
name = LOGOUT
do = logout

[command.1]
name = TERMINAL-STATUS
alias = WHO-IS-ON
do = who

[command.2]
name = DATCL
text = {time}  {date}

[command.3]
name = LIST-FILES
do = ls

[command.4]
name = HELP
file = help.txt

[file.0]
path = (GUEST)LOGIN:MODE
content = login-mode.txt

[file.1]
path = (GUEST)README:SYMB
content = readme.txt
