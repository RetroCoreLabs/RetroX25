# A menu-driven bulletin board with an open guest account. Format: docs/x25host-format.md

[host]
name = NORDBBS
address = 24229002
sessions = 4
banner = banner.txt

[login]
user_prompt = "Name (GUEST for a guest visit): "
password_prompt = "Password: "
case = upper
attempts = 2
fail_text = No such member. Goodbye.
motd = motd.txt
then = menu.main

[user.0]
name = GUEST
password =

[user.1]
name = SYSOP
password = NORDLYS

[menu.main]
title = main-menu.txt
prompt = "Choice: "
item.0 = N | News | file:news.txt
item.1 = B | Bulletins | menu.bulletins
item.2 = W | Who is on | text:{user} from {calling}
item.3 = G | Goodbye | logout
unknown = Please type N, B, W or G.

[menu.bulletins]
title = bulletins-menu.txt
prompt = "Bulletin (or M for the main menu): "
item.0 = 1 | X.25 in the north | file:bulletin1.txt
item.1 = M | Main menu | menu.main
unknown = No such bulletin.

[shell]
logout_text = Thank you for calling NORDBBS.