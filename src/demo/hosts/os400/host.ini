# An IBM AS/400 running OS/400, its 5250 screens sent as plain text. Format: docs/x25host-format.md.
# Texts: docs/research-os.md 4.3. Verbatim: the Sign On screen (IBM's QDSIGNON sample), the MAIN menu (CA
# Automation Point manual), the DSPMSG screen, CPF1107 Password not correct for user profile.
# Reconstructed: OS/400 has no line mode, and how an ASCII or X.25 caller saw the screens is not documented; here
# each screen is sent as lines of text, and the User and Password fields are asked one after the other below the
# screen. The values System, Subsystem QINTER and Display QPADEV0001 fill the sample's XXXX; the copyright years
# are left out. Only 90 (Sign off) and the message display work in the menu; the other choices answer that they
# are not available here. Function keys (F3, F12) cannot be sent by a plain terminal and are not taken.

[host]
hostname = S44A0060
sessions = 8
banner = signon.txt

[login]
user_prompt = "        User  . . . . . . . . . . . . . .   "
password_prompt = "        Password  . . . . . . . . . . . .   "
case = upper
attempts = 3
fail_text = CPF1107  Password not correct for user profile.
then = menu.main

[user.0]
name = GUEST
password = GUEST

[user.1]
name = QSECOFR
password = QSECOFR

[menu.main]
title = main-menu.txt
prompt = "===> "
item.0 = 1 | User tasks | text:Option 1 is not available on this system.
item.1 = 6 | Communications | text:Option 6 is not available on this system.
item.2 = DSPMSG | Display messages | file:dspmsg.txt
item.3 = 90 | Sign off | logout
unknown = Option {word} is not available on this system.

[shell]
logout_text = ""
