# A Honeywell 6180 running Multics MR10.2. Format: docs/x25host-format.md. Texts: docs/research-os.md 5.3.
# Verbatim (MIT Multics source archive, tut_logging_in and login.info): the "Multics MR10.2: ..." banner, the
# Load line's form, "l Smith" (login and l as the login command), Password:. Reconstructed (no source text): the
# "logged in" line, the ready message r time cpu faults, the logout lines and the cost, the wrong-password text,
# the unknown-command text and the command set. Not as on the real system: dates are 19-NOV-2026 (this format's
# vms form), not 11/19/26 0948.6 mst Thu; the ready message's CPU seconds and page faults are fixed; the Load
# line's figures are fixed.

[host]
hostname = MIT
sessions = 8
banner = banner.txt

[login]
command = login, l
command_prompt = ""
command_refused = Please login.
password_prompt = "Password:{nl}"
case = exact
attempts = 3
fail_text = Incorrect password supplied.
motd = motd.txt

[user.0]
name = Guest
password = guest

[user.1]
name = Smith
password = multics

[shell]
prompt = "r {time} 0.123 5{nl}{nl}"
case = lower
unknown = command_processor_: Command not found. {word}
logout_text = {user}.Project logged out {date} {time} mst{nl}CPU usage 3 sec, memory usage 12.1 units, cost $1.25.{nl}hangup
time_format = vms

[command.0]
name = logout
do = logout

[command.1]
name = who
do = who

[command.2]
name = date_time
alias = date
do = time

[command.3]
name = list
alias = ls
do = ls

[command.4]
name = print
alias = pr
do = cat

[file.0]
path = start_up.ec
content = start-up-ec.txt
