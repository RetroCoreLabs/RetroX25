# A VAX running 4.3BSD Unix, logged in to a C shell. Format: docs/x25host-format.md. Texts: docs/research-os.md 3.1.
# Verbatim (4.3BSD login.c and csh): login:, Password:, Login incorrect, "You have mail.", the % prompt,
# "Command not found.", logout. Reconstructed: the banner line (from the gettytab description) and the motd.

[host]
hostname = ucbvax
sessions = 8
banner = banner.txt

[login]
user_prompt = "login: "
password_prompt = "Password:"
case = exact
attempts = 5
fail_text = Login incorrect
motd = motd.txt

[user.0]
name = guest
password = guest

[user.1]
name = root
password = toor

[shell]
prompt = "% "
case = exact
unknown = {word}: Command not found.
unknown_file = {args}: No such file or directory
logout_text = logout
time_format = unix
who_format = "{user}    ttyp0   {since}   ({calling})"

[command.0]
name = logout
alias = exit
do = logout

[command.1]
name = ls
do = ls

[command.2]
name = cat
alias = more
do = cat

[command.3]
name = cd
do = cd

[command.4]
name = pwd
text = {cwd}

[command.5]
name = who
do = who

[command.6]
name = date
do = time

[command.7]
name = echo
do = echo

[command.8]
name = write
do = send

[command.9]
name = wall
do = wall

[command.10]
name = mesg
do = mesg

[command.11]
name = finger
do = finger

[command.12]
name = hostname
text = {hostname}

[file.0]
path = /etc
[file.1]
path = /etc/motd
content = motd.txt
[file.2]
path = /usr
[file.3]
path = /usr/guest
[file.4]
path = /usr/guest/.login
content = dot-login.txt
[file.5]
path = /usr/guest/notes
content = notes.txt
