# A Sun-4 running SunOS 4.1.1, logged in to a C shell. Format: docs/x25host-format.md. Texts: docs/research-os.md 3.2.
# Verbatim (a 1993 session): the "SunOS UNIX (host)" banner and login:. Reconstructed: the motd line (the kernel
# version string), and everything after login, which is taken from 4.3BSD (section 3.1): Password:,
# Login incorrect, the % prompt, "Command not found.", logout.

[host]
hostname = csdc_1
sessions = 8
banner = banner.txt

[login]
user_prompt = "login: "
password_prompt = "Password:"
case = exact
attempts = 5
fail_text = Login incorrect
motd = motd.txt

[user.0]
name = guest
password = guest

[user.1]
name = root
password = sun

[shell]
prompt = "{node}% "
case = exact
unknown = {word}: Command not found.
unknown_file = {args}: No such file or directory
logout_text = logout
time_format = unix
who_format = "{user}    ttyp0   {since}   ({calling})"

[command.0]
name = logout
alias = exit
do = logout

[command.1]
name = ls
do = ls

[command.2]
name = cat
alias = more
do = cat

[command.3]
name = cd
do = cd

[command.4]
name = pwd
text = {cwd}

[command.5]
name = who
do = who

[command.6]
name = date
do = time

[command.7]
name = hostname
text = {hostname}

[file.0]
path = /etc
[file.1]
path = /etc/motd
content = motd.txt
[file.2]
path = /home
[file.3]
path = /home/guest
[file.4]
path = /home/guest/README
content = readme.txt
