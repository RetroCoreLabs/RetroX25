# A PDP-11 running RSTS/E V10.1. Format: docs/x25host-format.md. Texts: docs/research-os.md 2.4.
# Verbatim (a V10.1 session): the banner line, User:, Password:, the two "Last ... login" lines, the $ prompt, and
# ^ over ?Invalid command for a command it does not know. From the V8.0 copy (Phrack 7): Invalid entry - try again.
# Reconstructed: the logout text (BYE), the command set (DIR, TYPE, SYSTAT, SHOW DAYTIME as DAYTIME) and the file;
# the account names are project,programmer numbers as on RSTS (1,2 is the system manager). Not as on the real
# system: dates are written 08-MAR-2019 style (this format's vms form), not 08-Mar-19; the "Last login" times are
# the time of this login, not the one before.

[host]
hostname = RSTS
sessions = 8
banner = banner.txt

[login]
user_prompt = "User: "
password_prompt = "Password: "
case = exact
attempts = 3
fail_text = Invalid entry - try again
motd = motd.txt

[user.0]
name = 200,200
password = GUEST

[user.1]
name = 1,2
password = SYSTEM

[shell]
prompt = "$ "
case = upper
unknown = ^{nl}?Invalid command
logout_text = Saved all disk files; 120 blocks in use{nl}Job 7 User {user} logged off KB41 at {date} {time}
time_format = vms

[command.0]
name = BYE
alias = BYE/F
do = logout

[command.1]
name = DIR
alias = DIRECTORY
do = ls

[command.2]
name = TYPE
do = cat

[command.3]
name = SYSTAT
do = who

[command.4]
name = DAYTIME
do = time

[file.0]
path = NOTICE.TXT
content = notice.txt
