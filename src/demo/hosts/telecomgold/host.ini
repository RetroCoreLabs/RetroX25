# Telecom Gold, BT's electronic mail service, reached through PSS. Format: docs/x25host-format.md.
# Texts: docs/research-os.md 1.2. Verbatim (BT training module, 1987; the source says scanning errors were tidied):
# Please Sign On, the > prompt, ID name as the sign-on command, Password:, the "Off At" and "Time used" lines.
# Reconstructed: what Telecom Gold printed after a good sign-on, the wrong-password text, the commands (MAIL,
# SCAN, TIME) and their texts. Not as on the real system: the date is 19-NOV-2026 09:48:40 (this format's vms
# form), not 19:19 11/06/87 BST; the "Time used" figures are fixed. The PAD lines of the same session (the PAD
# identification, ADD?, NUI?, +COM, CLR PAD) come from the PAD, not from this host.

[host]
hostname = TELECOMGOLD
sessions = 8
banner = banner.txt

[login]
command = ID
command_prompt = ">"
command_refused = Please Sign On
password_prompt = "Password: "
case = upper
attempts = 3
fail_text = Invalid ID or password
motd = motd.txt

[user.0]
name = MJB
password = GOLD

[user.1]
name = GUEST
password = GUEST

[shell]
prompt = ">"
case = upper
unknown = Unknown command {word}
logout_text = Off At {date} {time} BST{nl}Time used: 00h 01m connect, 00m 01s CPU, 00m 00s I/O.
time_format = vms

[command.0]
name = OFF
alias = BYE
do = logout

[command.1]
name = SCAN
do = ls

[command.2]
name = READ
alias = MAIL
do = cat

[command.3]
name = TIME
do = time

[file.0]
path = WELCOME
content = welcome.txt
