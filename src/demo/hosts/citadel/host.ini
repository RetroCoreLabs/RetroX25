# A Citadel bulletin board. Format: docs/x25host-format.md. Texts: docs/research-os.md 6.3.
# Verbatim (Citadel NOVICE.HLP): the Lobby> prompt (the room name and >), the commands <N>ew, <G>oto, <E>nter,
# <L>ogin, <T>erminate, <H>elp, and "lets you leave the system gracefully". Reconstructed: the banner, every
# text the commands print, and the rooms; a caller starts in the Lobby without a login, as a guest; <L>ogin and
# <E>nter only say that this board takes no accounts.

[host]
hostname = ODD-DUCK
sessions = 4
banner = banner.txt
start = menu.lobby

[menu.lobby]
prompt = "Lobby> "
item.0 = N | New messages | file:lobby-new.txt
item.1 = G | Goto | menu.xnet
item.2 = E | Enter | text:This board takes no new messages from guests.
item.3 = L | Login | text:This board takes no accounts: you are a guest.
item.4 = H | Help | file:help.txt
item.5 = T | Terminate | logout
unknown = Type H for help.

[menu.xnet]
prompt = "X.25 Net> "
item.0 = N | New messages | file:xnet-new.txt
item.1 = G | Goto | menu.lobby
item.2 = H | Help | file:help.txt
item.3 = T | Terminate | logout
unknown = Type H for help.

[shell]
logout_text = Goodbye, and thanks for calling {hostname}.
