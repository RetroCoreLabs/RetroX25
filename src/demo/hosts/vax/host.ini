# A VMS-style timesharing host: login, then a DCL command line. Format: docs/x25host-format.md

[host]
hostname = TOMVAX
address = 23429002
sessions = 8
banner = banner.txt

[login]
user_prompt = "Username: "
password_prompt = "Password: "
case = upper
attempts = 3
fail_text = User authorization failure
motd = motd.txt
then = shell

[user.0]
name = GUEST
password = GUEST

[user.1]
name = SYSTEM
password = MANAGER
greeting = system-greeting.txt

[shell]
prompt = "$ "
case = upper
unknown = %DCL-W-IVVERB, unrecognized command verb - check validity and spelling{nl} \{word}\
unknown_file = %TYPE-W-SEARCHFAIL, error searching for {args}{nl}-RMS-E-FNF, file not found
time_format = vms
logout_text = {user}         logged out at {date} {time}

[command.0]
name = LOGOUT
alias = LO,LOGOFF
do = logout

[command.1]
name = SHOW
file = show.txt

[command.2]
name = DIRECTORY
alias = DIR
do = ls

[command.3]
name = TYPE
do = cat

[command.4]
name = HELP
file = help.txt

[command.5]
name = SET
text = %SET-W-NOPRIV, insufficient privilege

[file.0]
path = LOGIN.COM
content = login-com.txt

[file.1]
path = NOTES.TXT
content = notes.txt
