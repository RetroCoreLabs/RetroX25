# An AT&T 3B2 running UNIX System V Release 4.0, logged in to the Bourne shell. Format: docs/x25host-format.md.
# Texts: docs/research-os.md 3.3. Verbatim: the "UNIX(r) System V Release 4.0 (host)" banner (a 1996 telnet
# session), login:, Login incorrect. Reconstructed: Password:, the $ prompt, "foo: not found", the file tree and
# the command set; the shell prints no text when it logs out.

[host]
hostname = joe
sessions = 8
banner = banner.txt

[login]
user_prompt = "login: "
password_prompt = "Password:"
case = exact
attempts = 5
fail_text = Login incorrect

[user.0]
name = guest
password = guest

[user.1]
name = root
password = 3b2

[shell]
prompt = "$ "
case = exact
unknown = {word}: not found
unknown_file = {args}: No such file or directory
logout_text = ""
time_format = unix

[command.0]
name = exit
do = logout

[command.1]
name = ls
do = ls

[command.2]
name = cat
alias = pg
do = cat

[command.3]
name = cd
do = cd

[command.4]
name = pwd
text = {cwd}

[command.5]
name = who
do = who

[command.6]
name = date
do = time

[command.7]
name = uname
text = {hostname}

[file.0]
path = /etc
[file.1]
path = /etc/issue
content = banner.txt
[file.2]
path = /home
[file.3]
path = /home/guest
[file.4]
path = /home/guest/README
content = readme.txt
