# An IBM mainframe running MVS 3.8j with TSO, on a line terminal. Format: docs/x25host-format.md.
# Texts: docs/research-os.md 4.1. Verbatim (TK4- user's manual, MVS and z/OS manuals): IKJ54012A ENTER LOGON -,
# LOGON userid, ENTER CURRENT PASSWORD FOR userid-, the IKJ56455I logon line, READY, IKJ56421I for a wrong
# password, IKJ56500I COMMAND ... NOT FOUND, IKJ56470I ... LOGGED OFF TSO. Reconstructed: the command set (TIME,
# STATUS, LISTCAT, LIST) and the data set. Not as on the real system: dates are written 19-NOV-2026 (this
# format's vms form), not NOVEMBER 19, 2026; a wrong password gives the logon prompt again, where TSO answers
# with the message and waits for a new LOGON; IKJ56710I INVALID USERID is not told apart from a wrong password.

[host]
hostname = MVS38J
sessions = 8

[login]
command = LOGON
command_prompt = "IKJ54012A ENTER LOGON -{nl}"
command_refused = IKJ54012A ENTER LOGON -
password_prompt = "ENTER CURRENT PASSWORD FOR {user}-{nl}"
case = upper
attempts = 3
fail_text = IKJ56421I PASSWORD NOT AUTHORIZED FOR USERID
motd = motd.txt

[user.0]
name = GUEST
password = GUEST

[user.1]
name = IBMUSER
password = SYS1

[shell]
prompt = "READY{nl}"
case = upper
unknown = IKJ56500I COMMAND {word} NOT FOUND
logout_text = IKJ56470I {user} LOGGED OFF TSO AT {time} ON {date}
time_format = vms

[command.0]
name = LOGOFF
do = logout

[command.1]
name = TIME
do = time

[command.2]
name = STATUS
do = who

[command.3]
name = LISTCAT
alias = LISTC
do = ls

[command.4]
name = LIST
do = cat

[file.0]
path = GUEST.CLIST
content = clist.txt
