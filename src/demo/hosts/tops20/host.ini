# A DECSYSTEM-20 running TOPS-20 Monitor 7. Format: docs/x25host-format.md. Texts: docs/research-os.md 2.2.
# Verbatim (TOPS-20 user's guide, 1988): the banner line, the @ prompt, LOGIN (USER) (PASSWORD) (ACCOUNT) on one
# line, the "Job .. on TTY.." line, ?Unrecognized command, and the "Killed Job" logout lines.
# Reconstructed: the wrong-password text (the guide does not show it), the job and TTY numbers (always 57 and
# 127), the "Used" times in the logout text (fixed), and the command set (DAYTIME, DIRECTORY, TYPE, SYSTAT).
# Not as on the real system: dates are written 18-NOV-2026 (this format's vms form), not 23-Jul-88; DAYTIME
# prints that form, not "Thursday, May 26, 1988"; the guide words (USER) (PASSWORD) are not typed by the host,
# and a password typed on the LOGIN line is echoed by the PAD (type LOGIN name, then RETURN, to have it hidden).

[host]
hostname = AURORA
sessions = 8
banner = banner.txt

[login]
command = LOGIN, LOG
command_prompt = "@"
command_refused = ?Unrecognized command
password_prompt = "Password: "
case = upper
attempts = 3
fail_text = ?Incorrect user name or password
motd = motd.txt

[user.0]
name = GUEST
password = GUEST

[user.1]
name = OPERATOR
password = DEC20

[shell]
prompt = "@"
case = upper
unknown = ?Unrecognized command
logout_text = Killed Job 57, User {user}, Account 341, TTY 127,{nl} at {date} {time}, Used 0:0:14 in 1:25:56
time_format = vms

[command.0]
name = LOGOUT
alias = LOGO
do = logout

[command.1]
name = DAYTIME
do = time

[command.2]
name = DIRECTORY
alias = DIR
do = ls

[command.3]
name = TYPE
do = cat

[command.4]
name = SYSTAT
do = who

[file.0]
path = LOGIN.CMD
content = login-cmd.txt
