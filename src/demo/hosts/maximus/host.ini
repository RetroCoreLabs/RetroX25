# A Maximus bulletin board on FidoNet. Format: docs/x25host-format.md. Texts: docs/research-os.md 6.1.
# Verbatim (lang/english.mad of the GPL source): "What is your name:", "Password:", "Sorry, but there's no answer.",
# the goodbye line. Reconstructed: the [MAIN]: menu prompt (from the format strings), the wrong-password text, the
# menu, banner, bulletin and the FidoNet node number.

[host]
hostname = ISARBOX
address = 26241003
sessions = 4
banner = banner.txt

[login]
user_prompt = "What is your name: "
password_prompt = "Password: "
case = upper
attempts = 3
fail_text = Invalid password.
motd = motd.txt
then = menu.main

[user.0]
name = GUEST
password =

[user.1]
name = SYSOP
password = FIDO

[menu.main]
title = main-menu.txt
prompt = "[MAIN]: "
item.0 = B | Bulletins | file:bulletin.txt
item.1 = Y | Yell for the sysop | text:Sorry, but there's no answer.
item.2 = W | Who is on | text:{user} from {calling}, node 2:246/1
item.3 = G | Goodbye | logout
unknown = Please choose B, Y, W or G.

[shell]
logout_text = Bye {user}; thanks for calling.  Please hang up now.
