# A Prime computer running PRIMOS 19.4. Format: docs/x25host-format.md. Texts: docs/research-os.md 5.2.
# Verbatim (Phrack 10 and 16): the PRIMENET banner, User ID?, Password?, the wrong-login text, the logged-in lines,
# the OK, prompt, Invalid command "...". Reconstructed: the logout text, the command set (STATUS, DATE, LD, SLIST)
# and the file; the date is written 2026-11-18, not "Monday, 15 Dec 86". The real system's ER! prompt after a
# failed command cannot be shown (this format has one prompt), so OK, follows every command.

[host]
hostname = PPOA1
address = 23421003
sessions = 8
banner = banner.txt

[login]
user_prompt = "User ID? "
password_prompt = "Password? "
case = upper
attempts = 3
fail_text = Invalid user id or password; please try again.
motd = motd.txt

[user.0]
name = GUEST
password = PRIME

[user.1]
name = SYSTEM
password = SYSTEM

[shell]
prompt = "OK, "
case = upper
unknown = Invalid command "{word}".
logout_text = {user} (user 39) logged out {date} {time}.
time_format = iso

[command.0]
name = LOGOUT
alias = LO
do = logout

[command.1]
name = STATUS
alias = STAT
do = who

[command.2]
name = DATE
do = time

[command.3]
name = LD
do = ls

[command.4]
name = SLIST
alias = TYPE
do = cat

[file.0]
path = LOGIN.CPL
content = login-cpl.txt
