# An IBM System/370 running VM/370 Release 6, logged on to CMS. Format: docs/x25host-format.md.
# Texts: docs/research-os.md 4.2. Verbatim (VM/370 Terminal User's Guide GC20-1810-9): VM/370 ONLINE, logon userid,
# ENTER PASSWORD:, the LOGMSG lines, the LOGON AT line, the CMS version line, R;, UNKNOWN CP/CMS COMMAND,
# DMKxxx050E PASSWORD INCORRECT (the module name LOG in DMKLOG is a guess: the guide writes xxx), the CONNECT=
# and LOGOFF AT lines. Reconstructed: CP's "." prompt before logon, the command set (QUERY TIME, LISTFILE, TYPE),
# the file, and that the session starts in CMS (the real one is in CP until the user types IPL CMS).
# Not as on the real system: dates are 19-NOV-2026 (this format's vms form), not 11/19/26; the CONNECT and CPU
# times are fixed.

[host]
hostname = VM370
sessions = 8
banner = banner.txt

[login]
command = LOGON, LOGIN, L
command_prompt = ".{nl}"
command_refused = ?CP: {word}
password_prompt = "ENTER PASSWORD:{nl}"
case = upper
attempts = 3
fail_text = DMKLOG050E PASSWORD INCORRECT
motd = motd.txt

[user.0]
name = GUEST
password = GUEST

[user.1]
name = MAINT
password = CPCMS

[shell]
prompt = "R;{nl}"
case = upper
unknown = UNKNOWN CP/CMS COMMAND
logout_text = CONNECT=00:01:12 VIRTCPU=000:00.04 TOTCPU=000:00.11{nl}LOGOFF AT {time} EST {date}
time_format = vms

[command.0]
name = LOGOFF
alias = LOG
do = logout

[command.1]
name = TIME
do = time

[command.2]
name = LISTFILE
alias = L
do = ls

[command.3]
name = TYPE
alias = T
do = cat

[file.0]
path = PROFILE EXEC
content = profile-exec.txt
