# Demo Switch A — DNIC 2350 (entry switch; the PAD connects here)
# Access port for the PAD on 2200; HDLC trunk toward B (connects to B on 2201).

[switch]
name = Switch-A
dnic = 2350
mgmt_port = 9101
monitor_port = 4001
# In-band management address (X.25). The NMC calls this to poll and to seed network discovery.
mgmt_addr = 23500000

# Access port the PAD connects to.
#
# lci_count: how many calls this port carries at once. Each call has its own TCP connection and its
# own logical channel here (RFC 1613 section 5), and the number the caller puts on the wire is not
# used as it is, so the range does not have to match the caller's. The default is 16. x25traffic in
# call-storm mode (-C) holds up to 2048 calls open together, so this port declares 2048; x25pad needs
# far fewer. The C emulator's demo declares 64 on its access ports.
[port.0]
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 2200
lci_count = 2048

# Trunk toward B (we connect out). A leased line: LAPB over 0x7E HDLC framing on one TCP connection
# (transport = hdlc-tcp), as in the C emulator's demo. We are the DTE end, so we dial B and send the SABM.
# lapb_t1 etc. are not set, so the defaults apply (T1 3 s, N2 10, window 7).
# lci_count = 2048: a line carries all its calls on one connection, numbered 1 to lci_count (default 16),
# so it needs the same room as the access port for a call storm. Switches B and C do the same.
# peer_* declares B for the network map (management/monitor plane only; X.25 is untouched).
[port.1]
type = trunk
transport = hdlc-tcp
mode = dte
host = 127.0.0.1
port = 2201
lci_count = 2048
peer_name = Switch-B
peer_monitor_host = 127.0.0.1
peer_monitor_port = 4002
peer_mgmt_addr = 23510000

# Trunk toward the WSL reference network (WSL connects IN to us here). This one stays XOT.
# Bound to 0.0.0.0 so it is reachable at this host's LAN address (e.g. 192.168.1.180).
# peer_mgmt_addr is the WSL entry switch's in-band management address; the NMC walks into the WSL
# network through it over real X.25 (calls for 234x route out this trunk, per route.0 below).
[port.2]
type = trunk
transport = xot
mode = dce
host = 0.0.0.0
port = 2210
peer_name = WSL-Reference
peer_mgmt_addr = 23400000

# Calls for WSL DNICs (234x) go out the WSL trunk; everything else toward B.
[route.0]
type = prefix
address = 234
prefix_len = 3
port = 2

[route.1]
type = default
port = 1

# Management login for the in-band NMC (matches the x25nmc console default).
[user.0]
name = admin
password = admin
level = 1
