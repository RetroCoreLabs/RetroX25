# Demo Switch B — DNIC 2351 (transit)
# HDLC trunk from A on 2201; HDLC trunk toward C (connects to C on 2202).

[switch]
name = Switch-B
dnic = 2351
mgmt_port = 9102
monitor_port = 4002
mgmt_addr = 23510000

# Trunk toward A (A connects in). A leased line: LAPB over 0x7E HDLC framing on one TCP connection.
# We are the DCE end: we listen and wait for A's SABM.
[port.0]
type = trunk
transport = hdlc-tcp
mode = dce
host = 0.0.0.0
port = 2201
lci_count = 2048
peer_name = Switch-A
peer_monitor_host = 127.0.0.1
peer_monitor_port = 4001
peer_mgmt_addr = 23500000

# Trunk toward C (we connect out). Same kind of line; we are the DTE end and dial C.
[port.1]
type = trunk
transport = hdlc-tcp
mode = dte
host = 127.0.0.1
port = 2202
lci_count = 2048
peer_name = Switch-C
peer_monitor_host = 127.0.0.1
peer_monitor_port = 4003
peer_mgmt_addr = 23520000

# 2352 goes to C, 2350 goes back to A, everything else to C.
[route.0]
type = dnic
dnic = 2352
port = 1

[route.1]
type = dnic
dnic = 2350
port = 0

[route.2]
type = default
port = 1

# Management login for the in-band NMC (matches the x25nmc console default).
[user.0]
name = admin
password = admin
level = 1
