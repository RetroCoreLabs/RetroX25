# The switch that runs INSIDE the Desktop app (RetroX25.exe), for the Cisco bench.
# The Desktop config docs/config-samples/x25config-embedded-switch.json turns it on.
#
# Our side:   DNIC 2350, this PC (192.168.1.180 in the bench).
# Cisco side: DNIC 2360, router R1 at 192.168.1.155.
# The Desktop app's own links: it dials the "callers" port below, and it listens on 1999 for the
# calls this switch sends to its built-in TAD (a test service that answers and echoes text).
#
# Do not run the x25switch program with the other file (demo/switch-cisco.ini) at the same time:
# both listen on 1998.

[switch]
name = Switch-Desktop
dnic = 2350
mgmt_addr = 23500000

# The Desktop app's own PAD/TAD links dial in here.
[port.0]
type = access
transport = xot
mode = dce
host = 127.0.0.1
port = 2200
lci_count = 64

# The Cisco router dials IN to us here (it sends every call for 2350... and 2343... to this PC, port 1998).
[port.1]
type = trunk
transport = xot
mode = dce
host = 0.0.0.0
port = 1998
peer_name = Cisco-R1

# We dial OUT to the Cisco router here (it listens on 1998).
[port.2]
type = trunk
transport = xot
mode = dte
host = 192.168.1.155
port = 1998
peer_name = Cisco-R1

# We dial OUT to the Desktop app's own XOT listener (port 1999) for calls to its TAD.
[port.3]
type = trunk
transport = xot
mode = dte
host = 127.0.0.1
port = 1999
peer_name = Desktop-TAD

# Calls for the Desktop's TAD (2343...) go to the Desktop app.
[route.3]
type = prefix
address = 2343
prefix_len = 4
port = 3

# Calls for the Cisco side (2360...) go out to the router.
[route.1]
type = prefix
address = 2360
prefix_len = 4
port = 2

# Calls for our own DNIC go to the local services.
[route.0]
type = dnic
dnic = 2350
port = 0

[user.0]
name = admin
password = admin
level = 1
