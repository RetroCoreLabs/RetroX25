# Demo switch for testing against a Cisco router (GNS3 / Dynamips) over XOT.
#
# Our side:   DNIC 2350, this switch runs on the Windows PC, 192.168.1.180 on the LAN.
# Cisco side: DNIC 2360, router R1 at 192.168.1.155 (GNS3 on a Linux laptop, cloud bridged to its wired NIC).
#
# Cisco XOT always uses TCP port 1998 (RFC 1613). The router connects TO port 1998 on the
# address in its "x25 route ... xot <ip>" line, and it listens on 1998 for calls coming in.
# So we need one port that listens on 1998 (the router dials us) and one that connects out to
# the router's 1998 (we dial the router).

[switch]
name = Switch-Cisco
dnic = 2350
mgmt_port = 9104
monitor_port = 4004
mgmt_addr = 23500000

# Callers: x25pad and x25traffic connect here. (x25echo has its own port, port.3 below.)
[port.0]
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 2200
lci_count = 64

# The echo service attaches here. It needs its OWN port: the switch joins a call coming in on one
# port to a call going out on another, so a caller on port 0 can never be joined to a service
# that is also on port 0 (the switch clears such a call with cause 13, not obtainable).
[port.3]
type = access
transport = xot
mode = dce
host = 0.0.0.0
port = 2203
lci_count = 64

# The Cisco router dials IN to us here (it sends every call for 2350... to this PC, port 1998).
[port.1]
type = trunk
transport = xot
mode = dce
host = 0.0.0.0
port = 1998
peer_name = Cisco-R1

# We dial OUT to the Cisco router here (it listens on 1998).
[port.2]
type = trunk
transport = xot
mode = dte
host = 192.168.1.155
port = 1998
peer_name = Cisco-R1

# The echo service address goes to the echo port. An exact route wins over the DNIC route below.
[route.2]
type = exact
address = 23500001
port = 3

# Calls for our own DNIC go to the local services.
[route.0]
type = dnic
dnic = 2350
port = 0

# Calls for the Cisco side (2360...) go out to the router.
[route.1]
type = prefix
address = 2360
prefix_len = 4
port = 2

[user.0]
name = admin
password = admin
level = 1
