# A large demo network, written as countries, links and hosts. ./large.ps1 generate turns it into one switch ini
# per country and one machines.ini for x25host (in generated/, not kept in git); ./large.ps1 start runs it all.
#
# [country.N]  name, dnic (4 digits). Every country gets, on its own TCP ports (README.md, "Ports"):
#                a PAD line (no NUI asked), an echo service <dnic>9001, and a host line for <dnic>1xxx.
# [link.N]     a, b: two country names joined by X.75. The country listed first listens, the other dials.
#              Calls to a country with no direct link go along the shortest chain of links (fewest hops).
# [host.N]     country, type (a folder in ../hosts, or "script" with script = a .js file), hostname.
#              The numbers are given in order per country: <dnic>1001, <dnic>1002, ...
#
# The DNICs are the real ones of the time (X.121 Annex: 2422 Norway, 2342 UK PSS, 2624 Germany Datex-P,
# 2405 Sweden Datapak, 2080 France Transpac, 3106 USA Tymnet, 3110 USA Telenet); the hosts are this library's.

[country.0]
name = Norway
dnic = 2422

